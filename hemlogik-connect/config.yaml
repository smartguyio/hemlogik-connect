# https://developers.home-assistant.io/docs/apps/configuration - "Apps" (formerly "Add-ons") App
# configuration manifest. Field reference verified directly against current HA developer docs and
# the official home-assistant/apps-example repository before writing this file - see the Hemlogik
# Connect architecture plan for the exact fields checked.

name: Hemlogik Connect
version: "0.5.0"
slug: hemlogik_connect
description: "Connects Home Assistant securely to Hemlogik for remote access, monitoring and management."
url: "https://github.com/smartguyio/Hemlogik/tree/master/ha-app/hemlogik-connect"

arch:
  - aarch64
  - amd64
  - armv7

startup: services
boot: auto
panel_icon: mdi:cloud-lock

# Required whenever the image has its own init system, which the HA base images do (s6-overlay).
# Default is true, which makes Supervisor run the container with Docker's own init process too -
# s6-overlay v3 refuses to start when it isn't PID 1, which is exactly what that collision causes
# ("s6-overlay-suexec: fatal: can only run as pid 1"). This was missing and is the fix.
init: false

# Core/Supervisor access - NOT a manually-created Home Assistant Long-Lived Access Token
# (AGENTS spec s12). homeassistant_api supplies the locally-provided SUPERVISOR_TOKEN env var and
# proxies REST (http://supervisor/core/api/...) + WebSocket (ws://supervisor/core/websocket) to
# Core. hassio_api (default role) is used only for the small set of Supervisor-level calls the
# agent needs (self/info, restart) - never anything beyond "default" role's scope.
hassio_api: true
homeassistant_api: true
hassio_role: default

# /data is this App's own persistent directory (survives restarts/updates/host reboots, not
# shared with any other App) - the ONLY place the connector credential and Cloudflare tunnel token
# are ever written on-device (credential-store.ts / cloudflared-supervisor.ts).
map:
  - data:rw

# Deliberately minimal - only the connection key an installer pastes in, plus an optional advanced
# log level. No Cloudflare terminology, no infra settings, no HA token field (AGENTS spec s10/s48).
options:
  enrollment_key: ""
  log_level: "info"
schema:
  enrollment_key: "str?"
  log_level: "list(debug|info|warning|error)?"

# No `image:` field, deliberately: that would tell Supervisor to PULL a prebuilt image from a
# registry instead of building it. Until a CI workflow exists to publish
# ghcr.io/smartguyio/hemlogik-connect-{arch} images, omitting `image` is what makes Supervisor
# build this App locally from the Dockerfile/build.yaml right here when it's installed from this
# repository - the correct behavior for local/custom Add-on repositories with no registry image
# published yet. Add `image:` back once a real publish pipeline exists (faster installs, no
# build step on the HA host).
